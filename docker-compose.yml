version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: telespazio_db
    restart: always
    environment:
      POSTGRES_DB: telespazio
      POSTGRES_USER: telespazio_user
      POSTGRES_PASSWORD: telespazio_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
