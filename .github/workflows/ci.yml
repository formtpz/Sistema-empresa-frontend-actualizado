name: Validar migracion PostgreSQL
on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/postgres-etapa4]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias y actualizar lockfile en CI
        run: |
          npm install --include=optional --no-audit --no-fund
          npm install --no-save --no-package-lock --include=optional "lightningcss-linux-x64-gnu@$(node -p 'require("lightningcss/package.json").version')"
      - name: Guardar lockfile regenerado
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/postgres-etapa4'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync package-lock.json after Prisma removal'
            git push origin HEAD:refactor/postgres-etapa4
          fi
      - name: Validar TypeScript
        run: npx tsc --noEmit
      - name: Validar ESLint
        run: npm run lint
      - name: Compilar Next.js
        run: npm run build
