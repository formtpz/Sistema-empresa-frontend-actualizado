name: Validar migracion PostgreSQL
on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/postgres-etapa4]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: |
          npm ci --include=optional --no-audit --no-fund
          npm install --no-save --no-package-lock --include=optional "lightningcss-linux-x64-gnu@$(node -p 'require("lightningcss/package.json").version')"
      - name: Validar TypeScript
        run: npx tsc --noEmit
      - name: Validar ESLint
        run: npm run lint
      - name: Compilar Next.js
        run: npm run build
