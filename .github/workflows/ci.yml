name: Validar migracion PostgreSQL
on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/postgres-etapa4]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias y actualizar lockfile en CI
        run: npm install --no-audit --no-fund
      - name: Validar TypeScript
        run: npx tsc --noEmit
      - name: Validar ESLint
        run: npm run lint
      - name: Compilar Next.js
        run: npm run build
